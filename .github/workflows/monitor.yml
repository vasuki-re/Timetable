name: Timetable Monitor

on:
  push:
    paths:
      - 'timetable.txt'

jobs:
  notify-devices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Send FCM Notification
        env:
          FCM: ${{ secrets.FCM }}
        run: |
          npm install google-auth-library
          
          cat << 'EOF' > send_fcm.js
          const { JWT } = require('google-auth-library');
          const https = require('https');
          const util = require('util');
          const exec = util.promisify(require('child_process').exec);

          async function sendNotification() {
            if (!process.env.FCM) {
              console.error("Missing FCM secret.");
              process.exit(1);
            }

            let action = "update_timetable_partial";
            let addedStr = "";
            let deletedStr = "";
            try {
              const { stdout } = await exec('git diff HEAD~1 HEAD -- timetable.txt');
              const lines = stdout.split('\n');
              const added = [];
              const deleted = [];
              for (const line of lines) {
                if (line.startsWith('+') && !line.startsWith('+++')) {
                  added.push(line.substring(1).trim());
                } else if (line.startsWith('-') && !line.startsWith('---')) {
                  deleted.push(line.substring(1).trim());
                }
              }
              addedStr = added.filter(l => l.length > 0).join('\n');
              deletedStr = deleted.filter(l => l.length > 0).join('\n');
              console.log("Added lines:", addedStr);
              console.log("Deleted lines:", deletedStr);
            } catch (error) {
              console.error("Error getting git diff (maybe first commit?):", error);
              action = "update_timetable"; 
            }
            
            const serviceAccount = JSON.parse(process.env.FCM);
            const projectId = serviceAccount.project_id;
            
            const client = new JWT({
              email: serviceAccount.client_email,
              key: serviceAccount.private_key,
              scopes: ['https://www.googleapis.com/auth/firebase.messaging'],
            });
            
            const tokens = await client.authorize();
            const accessToken = tokens.access_token;
            
            let payload = JSON.stringify({
              message: {
                topic: "timetable_updates",
                data: {
                  action: action,
                  added: addedStr,
                  deleted: deletedStr
                }
              }
            });

            if (Buffer.byteLength(payload) > 3500) {
                console.warn("Payload too large for partial update, falling back to full update.");
                payload = JSON.stringify({
                    message: {
                        topic: "timetable_updates",
                        data: {
                            action: "update_timetable"
                        }
                    }
                });
            }
            
            const options = {
              hostname: 'fcm.googleapis.com',
              path: `/v1/projects/${projectId}/messages:send`,
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${accessToken}`,
                'Content-Type': 'application/json',
                'Content-Length': Buffer.byteLength(payload)
              }
            };
            
            const req = https.request(options, (res) => {
              console.log(`FCM Response Status: ${res.statusCode}`);
              res.on('data', (d) => process.stdout.write(d));
            });
            
            req.on('error', (error) => console.error('Error sending FCM:', error));
            req.write(payload);
            req.end();
          }
          
          sendNotification().catch(console.error);
          EOF
          node send_fcm.js
